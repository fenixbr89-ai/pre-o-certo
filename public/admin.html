<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Preço Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fd;--card:#fff;--ink:#17181a;--mute:#6b6f76;--line:#dfe8f1;--g:#2272e6;--gl:#d9ecff;--gd:#0a3a7a;--red:#dc2626;--warn:#fef3c7;--warnt:#b45309;--grad:linear-gradient(90deg,#1f6fe5,#4aa3f7);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto}
h1{font-size:25px;line-height:1.15;letter-spacing:-.035em;font-weight:800;margin:10px 0 2px}
p{margin:0}.mute{color:var(--mute)}.sm{font-size:13px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input{width:100%;height:48px;font:500 17px "Plus Jakarta Sans",sans-serif;padding:0 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:14px;background:var(--grad);color:#fff;font:700 17px/1 "Plus Jakarta Sans",sans-serif;height:50px;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.6}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:14px;font-weight:600;height:44px;margin:0}
.btn.sec.arm{background:var(--warn);border-color:var(--warnt);color:var(--warnt)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lnk{background:none;border:0;color:var(--g);font:600 15px "Plus Jakarta Sans",sans-serif;cursor:pointer;padding:10px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-size:26px;letter-spacing:-.03em;font-weight:800}
.tile span{font-size:12.5px;color:var(--mute);font-weight:600}
.err{background:#fee2e2;color:#991b1b;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
.chip{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.c-em_teste{background:var(--gl);color:var(--gd)}.c-completo{background:var(--gd);color:#fff}
.c-teste_acabou{background:var(--warn);color:var(--warnt)}.c-admin{background:#e5e7eb;color:#111827}
.who{min-width:0}.who b{display:block;font-size:16px;letter-spacing:-.01em;overflow-wrap:anywhere}
.who span{display:block;color:var(--mute);font-size:13.5px;overflow-wrap:anywhere}
.u{display:flex;flex-direction:column;gap:10px}
.u .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts:has(> :only-child){grid-template-columns:1fr}
.meta{font-size:12.5px;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Admin</h1>
  <p class="mute sm">Contas, planos e teste grátis do Preço Certo.</p>

  <section id="login" class="card" hidden>
    <b>Entrar como admin</b>
    <form id="f" autocomplete="on">
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email" required>
      <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" id="go" type="submit">Entrar</button>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="top"><span class="mute sm" id="who"></span><button class="lnk" id="out" type="button">Sair</button></div>
    <div class="tiles">
      <div class="tile"><b id="s-total">0</b><span>Contas</span></div>
      <div class="tile"><b id="s-completo">0</b><span>Plano Completo</span></div>
      <div class="tile"><b id="s-em_teste">0</b><span>Em teste</span></div>
      <div class="tile"><b id="s-teste_acabou">0</b><span>Teste acabou</span></div>
    </div>
    <label for="q">Buscar por e-mail ou nome</label>
    <input id="q" type="text" inputmode="search" placeholder="Ex.: maria@" autocomplete="off">
    <div id="list"></div>
  </section>

  <div class="err" id="err" hidden></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = null, timer = null;
  var LABEL = { em_teste: 'Em teste', teste_acabou: 'Teste acabou', completo: 'Plano Completo', admin: 'Admin' };

  function show(el, on) { el.hidden = !on; }
  function showErr(msg) { var e = $('err'); e.textContent = msg || ''; show(e, !!msg); }
  function store(t) { token = t; try { if (t) sessionStorage.setItem('pc_admin', t); else sessionStorage.removeItem('pc_admin'); } catch (e) {} }

  async function api(path, opt) {
    opt = opt || {};
    var h = { 'Content-Type': 'application/json' };
    if (token) h.Authorization = 'Bearer ' + token;
    var r;
    try { r = await fetch(path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
    catch (e) { var n = new Error('Sem conexão com o servidor. Se ele estava parado, espere cerca de 1 minuto e tente de novo.'); n.status = 0; throw n; }
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok) {
      var m = typeof d.detail === 'string' ? d.detail : (d.detail && d.detail.message) || ('Erro ' + r.status);
      var er = new Error(m); er.status = r.status; throw er;
    }
    return d;
  }
  function fmt(ms) { return ms ? new Date(ms).toLocaleDateString('pt-BR') : '-'; }
  function fmtT(ms) { return ms ? new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-'; }

  function toLogin(msg) { store(null); show($('panel'), false); show($('login'), true); showErr(msg || ''); }

  async function load() {
    showErr('');
    try {
      var d = await api('/api/admin/users?q=' + encodeURIComponent($('q').value.trim()));
      show($('login'), false); show($('panel'), true);
      ['total', 'completo', 'em_teste', 'teste_acabou'].forEach(function (k) { $('s-' + k).textContent = d.summary[k] || 0; });
      draw(d.users);
    } catch (e) {
      if (e.status === 401) toLogin(token ? 'Sessão expirada. Entre de novo.' : '');
      else if (e.status === 403) { show($('panel'), false); show($('login'), false); showErr('Esta conta não é admin. No Render, coloque o seu e-mail na variável ADMIN_EMAIL e reinicie a API.'); }
      else { show($('login'), !token); showErr(e.message); }
    }
  }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function draw(users) {
    var box = $('list'); box.textContent = '';
    if (!users.length) { var e = el('div', 'card mute', 'Nenhuma conta encontrada.'); box.appendChild(e); return; }
    users.forEach(function (u) {
      var c = el('div', 'card u');
      var h = el('div', 'h'), who = el('div', 'who');
      who.appendChild(el('b', '', u.name || u.email));
      if (u.name) who.appendChild(el('span', '', u.email));
      h.appendChild(who); h.appendChild(el('span', 'chip c-' + u.status, LABEL[u.status] || u.status));
      c.appendChild(h);
      var meta = 'Criada em ' + fmt(u.created);
      if (u.status === 'em_teste') meta += ' · teste até ' + fmtT(u.trial_end);
      if (u.status === 'teste_acabou') meta += ' · teste acabou em ' + fmtT(u.trial_end);
      if (u.status === 'completo') meta += u.manual ? ' · liberado por você' : (u.sub ? ' · assinatura: ' + u.sub : '');
      c.appendChild(el('div', 'meta', meta));
      var acts = el('div', 'acts');
      if (u.status !== 'admin') {
        if (u.status === 'completo') acts.appendChild(button('Voltar para grátis', u, 'plan', 'free'));
        else acts.appendChild(button('Liberar plano Completo', u, 'plan', 'pro'));
        if (u.status !== 'completo') acts.appendChild(button('Reiniciar teste de 7 dias', u, 'trial'));
        c.appendChild(acts);
      }
      box.appendChild(c);
    });
  }

  function button(label, u, kind, plan) {
    var b = el('button', 'btn sec', label); b.type = 'button';
    var t;
    b.addEventListener('click', async function () {
      if (!b.classList.contains('arm')) {
        b.classList.add('arm'); b.textContent = 'Toque de novo para confirmar';
        t = setTimeout(function () { b.classList.remove('arm'); b.textContent = label; }, 4000);
        return;
      }
      clearTimeout(t); b.disabled = true; b.textContent = 'Salvando...';
      try {
        await api('/api/admin/users/' + encodeURIComponent(u.id) + '/' + kind, { method: 'POST', body: kind === 'plan' ? { plan: plan } : {} });
        await load();
      } catch (e) { b.disabled = false; b.classList.remove('arm'); b.textContent = label; showErr(e.message); }
    });
    return b;
  }

  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault(); showErr('');
    var b = $('go'); b.disabled = true; b.textContent = 'Entrando...';
    try {
      var d = await api('/api/login', { method: 'POST', body: { email: $('em').value.trim(), password: $('pw').value } });
      store(d.token); $('pw').value = ''; $('who').textContent = d.user && d.user.email || '';
      await load();
    } catch (e) { showErr(e.message); }
    b.disabled = false; b.textContent = 'Entrar';
  });
  $('out').addEventListener('click', function () { toLogin(''); });
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(load, 300); });

  // reaproveita a sessão aberta no site, se houver
  try { token = sessionStorage.getItem('pc_admin') || localStorage.getItem('pc_t'); } catch (e) { token = null; }
  if (token) load(); else show($('login'), true);
})();
</script>
</body>
</html>
