<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preço Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--s:1;--bg:#f4f4f2;--card:#fff;--ink:#17181a;--mute:#6b6f76;--line:#e4e5e2;--g:#059669;--gl:#d1fae5;--gd:#064e3b;--dark:#1a1b1d;--warn:#fef3c7;--warnt:#b45309;--red:#dc2626}
html{font-size:calc(1rem*var(--s))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:0.9375rem;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(0.625rem + env(safe-area-inset-top,0px)) 1.125rem 6rem}
#app.full{padding:0;background:var(--dark)}
h2{font-size:1.5625rem;line-height:1.15;letter-spacing:-.035em;font-weight:800;margin:0.375rem 0 0.25rem}
h3{font-size:1.125rem;letter-spacing:-.02em;font-weight:800;margin:1.25rem 0 0.625rem}
p{margin:0}.mute{color:var(--mute)}.sm{font-size:0.8125rem}
svg{display:block;flex:none}
.back{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--g);font:600 1rem "Plus Jakarta Sans",sans-serif;padding:0.375rem 0;cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:1.125rem;padding:1rem 1.0625rem;margin-bottom:0.75rem;width:100%;text-align:left;font-family:inherit;color:inherit;display:block;position:relative}
button.card{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.grid .card{margin:0;min-height:7.375rem;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:1.0625rem;letter-spacing:-.015em;padding:1.0625rem}
.ic{width:2.75rem;height:2.75rem;border-radius:0.75rem;background:var(--gl);color:var(--gd);display:grid;place-items:center;margin-bottom:0.875rem}
.btn{display:flex;gap:0.625rem;align-items:center;justify-content:center;width:100%;border:0;border-radius:0.875rem;background:var(--g);color:#fff;font:700 1.125rem "Plus Jakarta Sans",sans-serif;letter-spacing:-.015em;height:3.25rem;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:0.9375rem;height:2.75rem;font-weight:600}
.btn:disabled{opacity:.6}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0.75rem 1.125rem calc(0.75rem + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar>div{max-width:520px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin:calc(-0.625rem - env(safe-area-inset-top,0px)) -1.125rem 1rem;padding:calc(0.625rem + env(safe-area-inset-top,0px)) 1.125rem 0.75rem}
.avatar{width:2.75rem;height:2.75rem;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;border:0;cursor:pointer;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;gap:0.75rem}.row>*{flex:1;min-width:0}
.pill{background:var(--dark);color:#fff;border-radius:1.25rem;padding:0.875rem 1rem;margin:0.25rem 0 0.75rem;display:flex;align-items:center;gap:0.75rem;width:100%;border:0;font-family:inherit;text-align:left;min-height:4.4375rem}
.pill b{font-size:1.125rem;letter-spacing:-.02em;display:block}.pill small{opacity:.65;font-size:0.8125rem}
.pill svg:first-child{color:#34d399}.pill .go{margin-left:auto}
.cost{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}.sell{color:var(--g);font-weight:600;font-size:0.8125rem}
.tag{display:inline-flex;gap:0.375rem;align-items:center;background:var(--warn);color:var(--warnt);border-radius:6.1875rem;padding:0.375rem 0.75rem;font-size:0.8125rem;font-weight:600}
label{display:block;font-size:0.875rem;color:var(--mute);margin:0.75rem 0 0.375rem}
input[type=text],input[type=number],input[type=email],input[type=password]{width:100%;height:3rem;font:500 1.0625rem "Plus Jakarta Sans",sans-serif;padding:0 0.9375rem;border-radius:0.875rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.steps{display:flex;gap:0.5rem;margin:0.75rem 0 1.125rem}
.steps div{flex:1;display:flex;gap:0.5rem;align-items:center;padding:0 0.625rem;height:2.75rem;border-radius:0.875rem;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:0.9375rem;color:var(--mute)}
.steps i{font-style:normal;width:1.3125rem;height:1.3125rem;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:0.75rem;color:var(--ink)}
.steps .on{background:var(--gl);border-color:var(--g);color:var(--gd)}.steps .on i{background:var(--g);color:#fff}
.kick{color:var(--g);font-weight:700;font-size:0.8125rem;letter-spacing:.04em;text-transform:uppercase;margin:2px 0 0.375rem}
.total{background:var(--dark);color:#fff;border-radius:1.125rem;padding:1rem 1.125rem;margin:1rem 0 0;display:flex;justify-content:space-between;align-items:center;min-height:5.625rem}
.total span{opacity:.7;font-size:0.875rem;display:block}.total b{font-size:2rem;letter-spacing:-.04em;line-height:1.15}
.okc{width:1.4375rem;height:1.4375rem;border-radius:50%;background:#34d399;color:var(--dark);display:grid;place-items:center}
.kind{display:inline-flex;gap:0.375rem;align-items:center;background:var(--gl);color:var(--gd);border:0;border-radius:6.1875rem;padding:0.375rem 0.75rem;font:700 0.875rem "Plus Jakarta Sans",sans-serif;cursor:pointer}
.del{position:absolute;top:0.875rem;right:0.875rem;background:none;border:0;color:var(--red);cursor:pointer}.dup{position:absolute;top:0.875rem;right:3.25rem;background:none;border:0;color:var(--g);cursor:pointer}
.chips{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.75rem 0}
.chip{border:1.5px solid var(--line);background:var(--card);padding:0.5625rem 1rem;border-radius:6.1875rem;font:600 0.9375rem "Plus Jakarta Sans",sans-serif;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
input[type=range]{width:100%;accent-color:var(--g);height:2.25rem}
.big{font-size:2.75rem;font-weight:800;letter-spacing:-.04em}
.price{display:flex;justify-content:space-between;align-items:center;gap:0.625rem}.price b.v{font-size:1.375rem;color:var(--g);letter-spacing:-.02em}
.photo{position:relative;background:var(--dark);color:#fff;padding:0 1.5625rem}
.photo:before{display:none}.art{display:block;margin:0 -1.5625rem;width:calc(100% + 3.125rem);height:auto;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.photo h1{position:relative;font-size:2.375rem;line-height:1.1;letter-spacing:-.04em;font-weight:700;margin:-1.625rem 0 0.75rem}
.photo p{font-size:1.0625rem;line-height:1.4;opacity:.88}
.wel{color:#fff;padding:1.375rem 1.5625rem calc(1.75rem + env(safe-area-inset-bottom,0px))}
.feat{display:flex;gap:0.75rem;align-items:center;margin:0.75rem 0;font-weight:500;font-size:0.9375rem;line-height:1.3;letter-spacing:-.01em}
.feat span{width:2rem;height:2rem;border-radius:50%;background:#3a3c40;color:#34d399;display:grid;place-items:center;flex:none}
.wel .btn{margin-top:1.125rem}
.wel .note{text-align:center;color:#8a8d90;font-size:0.8125rem;margin-top:1rem}
.err{background:#fee2e2;color:#991b1b;border-radius:0.875rem;padding:0.75rem 0.875rem;font-size:0.875rem;margin-top:0.875rem}
.okm{background:var(--gl);color:var(--gd);border-radius:0.875rem;padding:0.75rem 0.875rem;font-size:0.875rem;margin-top:0.875rem}
.lnk{background:none;border:0;color:var(--g);font:600 0.9375rem "Plus Jakarta Sans",sans-serif;cursor:pointer;padding:0.625rem 0}
.or{display:flex;align-items:center;gap:0.75rem;color:var(--mute);font-size:0.8125rem;margin:1rem 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
select{width:100%;height:3rem;font:500 1.0625rem "Plus Jakarta Sans",sans-serif;padding:0 .5rem;border-radius:.875rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
label{white-space:nowrap}
.in{position:relative}.in input{padding-right:2.4rem}.in i{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:.8125rem;pointer-events:none}
.in.pre input{padding-left:2.4rem;padding-right:.6rem}.in.pre i{left:.75rem;right:auto}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav>div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mute);font:600 11px "Plus Jakarta Sans",sans-serif;padding:6px 0;cursor:pointer}
.nav button.on{color:var(--g)}
#app.hasnav{padding-bottom:150px}
.bar.up{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.g{display:grid;gap:6px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lb{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}.tt{font-size:11px;white-space:nowrap}
input.mini[type]{height:38px;font-size:14px;padding:0 8px;border-radius:10px;width:100%;min-width:0}
.del2{background:none;border:0;color:var(--red);padding:0;display:grid;place-items:center;cursor:pointer}
.mch{display:flex;gap:8px;overflow-x:auto;margin:6px -18px 0;padding:6px 18px}.mch .chip{flex:none}
@media print{.noprint,.nav,.bar{display:none!important}body{background:#fff}}
textarea{width:100%;min-height:8rem;font:500 1.0625rem "Plus Jakarta Sans",sans-serif;padding:.75rem .9375rem;border-radius:.875rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--g);outline-offset:2px}
.faq details{background:var(--card);border:1.5px solid var(--line);border-radius:1.125rem;padding:.25rem 1.0625rem;margin-bottom:.625rem}
.faq summary{cursor:pointer;font-weight:700;padding:.75rem 0;list-style:none;display:flex;justify-content:space-between;gap:.5rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--g);font-size:1.25rem;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 0 .875rem;color:var(--mute);font-size:.9375rem;line-height:1.5}
.doc h3{margin:1.25rem 0 .375rem}.doc p{color:var(--mute);font-size:.9375rem;line-height:1.55;margin-bottom:.5rem}
#ck{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:.75rem .75rem calc(.75rem + env(safe-area-inset-bottom,0px))}
#ck>div{max-width:520px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:1.125rem;padding:1rem;box-shadow:0 8px 30px rgba(0,0,0,.18)}
@media(min-width:1024px){
#app{max-width:760px}
#app.full{max-width:none}
.photo,.wel{max-width:560px;margin:0 auto}
#app.hasnav{max-width:1100px;margin:0 0 0 max(240px,calc((100vw - 860px)/2));padding-bottom:6rem}
.grid{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(4,1fr)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem}
.pgrid .card{margin:0}
.bar>div{max-width:760px}
.nav{top:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding:1.25rem .75rem}
.nav>div{max-width:none;margin:0;flex-direction:column;gap:.25rem}
.nav button{flex:none;flex-direction:row;gap:.75rem;justify-content:flex-start;font-size:.9375rem;padding:.75rem 1rem;border-radius:.875rem}
.nav button.on{background:var(--gl)}
.bar.up{bottom:0;left:240px}
.bar.up>div{max-width:1060px}
}

/* ===== Início redesenhado ===== */
.mch{scroll-snap-type:x proximity;scrollbar-width:none}.mch::-webkit-scrollbar{display:none}
.mch .chip{scroll-snap-align:center}
.hero{background:var(--gd);color:#ecfdf5;border-radius:1.5rem;padding:1.25rem 1.25rem 1.125rem;margin:.875rem 0 .75rem}
.hero .lbl{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.8125rem;font-weight:600;color:#a7f3d0}
.hero .badge{background:rgba(255,255,255,.14);color:#fff;border-radius:6.1875rem;padding:.25rem .625rem;font-weight:700;font-size:.8125rem;white-space:nowrap}
.hero .badge.neg{background:#fecaca;color:#7f1d1d}
.hero .big{display:block;font-size:2.375rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:.5rem 0 1.125rem;color:#fff;overflow-wrap:anywhere}
.hero .big.neg{color:#fecaca}
.split{display:flex;height:.625rem;border-radius:6.1875rem;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.split i{display:block;height:100%}.split .a{background:#34d399}.split .b{background:#fb923c}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.875rem}
.flow div{min-width:0}.flow span{display:flex;align-items:center;gap:.375rem;font-size:.8125rem;color:#a7f3d0}
.flow span:before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:#34d399}
.flow .d span:before{background:#fb923c}
.flow b{display:block;font-size:1.0625rem;font-weight:700;color:#fff;margin-top:2px;overflow-wrap:anywhere}
.empty{display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:var(--card);border:1.5px dashed var(--line);border-radius:1.125rem;padding:.875rem 1rem;margin-bottom:.75rem}
.empty p{font-size:.875rem;color:var(--mute);line-height:1.4}
.empty .btn{width:auto;height:2.5rem;font-size:.9375rem;padding:0 1rem;flex:none}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:1.5rem;padding:1.125rem 1.125rem .5rem;margin-bottom:.75rem}
.sec h3{margin:0;font-size:1.0625rem;letter-spacing:-.015em}
.sec .sub{font-size:.8125rem;color:var(--mute);margin:2px 0 .25rem}
.rk{display:grid;grid-template-columns:1.75rem 1fr auto;gap:0 .625rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.sec h3+.rk,.sec .sub+.rk{margin-top:.625rem}
.rk .n{width:1.75rem;height:1.75rem;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;font-weight:800;font-size:.8125rem}
.rk .n.w{background:#fee2e2;color:#991b1b}
.rk .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .vl{text-align:right;font-weight:700}
.rk .m{grid-column:2/4;display:flex;align-items:center;gap:.625rem;margin-top:.5rem}
.rk .m u{flex:1;height:.375rem;border-radius:6.1875rem;background:var(--line);text-decoration:none;overflow:hidden}
.rk .m u i{display:block;height:100%;border-radius:6.1875rem;background:var(--g)}
.rk .m.w u i{background:var(--red)}
.rk .m small{font-size:.75rem;color:var(--mute);min-width:3.25rem;text-align:right}
.alert{display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:var(--warn);color:var(--warnt);border-radius:1.125rem;padding:.75rem 1rem;font-size:.875rem;font-weight:600;margin-bottom:.75rem}
.alert .lnk{padding:0;color:var(--warnt);text-decoration:underline;white-space:nowrap}
@media(min-width:760px){.hero{padding:1.5rem}.hero .big{font-size:3rem}}

.meta{background:var(--card);border:1.5px solid var(--line);border-radius:1.5rem;padding:1rem 1.125rem;margin-bottom:.75rem}
.mbar{height:.625rem;border-radius:6.1875rem;background:var(--line);overflow:hidden;margin:.625rem 0 .5rem}
.mbar i{display:block;height:100%;border-radius:6.1875rem;background:var(--g)}
.meta p{font-size:.8125rem;color:var(--mute)}
button.empty{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
</style>

<style id="preco-certo-dark-mode-v1">
:root{color-scheme:light}
html[data-theme="dark"]{
 color-scheme:dark;
 --bg:#111318;--card:#1c2028;--ink:#f3f4f6;--mute:#a8b0bf;
 --line:#343a46;--gl:#153e32;--gd:#a7f3d0;--dark:#090b10;
 --warn:#493719;--warnt:#fcd34d;--red:#f87171
}
html[data-theme="dark"] body,
html[data-theme="dark"] .bar{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea{
 background:var(--card);color:var(--ink);border-color:var(--line)
}
html[data-theme="dark"] .card,
html[data-theme="dark"] details,
html[data-theme="dark"] .btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .hd,
html[data-theme="dark"] .bar{border-color:var(--line)}
html[data-theme="dark"] svg text{fill:var(--ink)}
#pc-theme-toggle{
 position:fixed;right:14px;top:12px;z-index:9999;
 width:42px;height:42px;border:1px solid var(--line);
 border-radius:50%;background:var(--card);color:var(--ink);
 font-size:20px;box-shadow:0 2px 10px #0002;cursor:pointer
}
/* pc-global-wrap-fix */
html,body{max-width:100%;overflow-x:hidden}
#app{min-width:0;max-width:100%;overflow-wrap:anywhere}
#app p,#app h1,#app h2,#app h3,#app b,#app span,#app label,#app button,#app summary,#app .mute{overflow-wrap:anywhere;word-break:normal}
#app img{max-width:100%;height:auto}
#app input,#app select,#app textarea{min-width:0;max-width:100%}
#app .card{min-width:0;transition:background .18s,border-color .18s}
@media(prefers-reduced-motion:reduce){#app .card{transition:none}}
</style>

</head>

["Como o Preço Certo calcula o preço de venda?","Você cadastra os itens de cada produto (ingredientes, embalagens e custos de entrega), escolhe quanto quer ganhar e o app soma o custo com as taxas do canal (comissão do app, cartão, impostos e outros). O resultado é o preço que garante o seu ganho depois de todas as taxas."],

["Como funciona o teste grátis e a assinatura?","Depois de criar a conta você tem 7 dias grátis com tudo liberado. Passado esse prazo, o app fica bloqueado até você assinar o plano Completo, que custa R$ 19,90 por mês. Seus dados ficam guardados enquanto isso. Veja os detalhes em Mais, Planos e assinatura."],
["Meus dados ficam salvos?","Sim. Seus produtos, despesas e demais informações ficam salvos na sua conta e acompanham você quando entra de novo. Veja a Política de privacidade para mais detalhes."],

const INS=()=>S.ins||(S.ins=[]),HIS=()=>S.hist||(S.hist=[]);

const addIns=()=>{INS().push({id:"i"+Date.now(),n:"",t:"Ingrediente",sup:"",pack:0,yield:1,u:"g",q:0,min:0});save();render()};
const delIns=async i=>{if(!await cf("Remover insumo?"))return;INS().splice(i,1);save();render()};
const usedBy=g=>S.products.filter(p=>[...(p.items||[]),...(p.deliv||[])].some(t=>t.ref===g.id));
async function buy(i){const g=INS()[i],r=await mdl("Registrar compra: "+esc(g.n||"insumo"),`<label>Quantidade comprada (${US[g.u]||g.u})</label><input type="number" inputmode="decimal" step="any" placeholder="ex.: 2"><label>Valor pago por essa compra (R$)</label><input type="number" inputmode="decimal" step="any" placeholder="ex.: 117">`,"Registrar");if(!r)return;const q=num(r[0]),v=num(r[1]);if(!q||!v){info("Preencha a quantidade e o valor pago.");return}const o=num(g.yield)?num(g.pack)/num(g.yield):0,pa=usedBy(g),ca=pa.map(x=>cost(x));g.q=num(g.q)+q;g.pack=v;g.yield=q;HIS().push({id:g.id,n:g.n,o,v:v/q,u:g.u,at:Date.now(),pc:pa.map((x,j)=>({n:x.name,a:ca[j],b:cost(x)}))});save();render()}
const gm=(p)=>{const o=hasOwn(p),c=calc(p,"own",o),pr=num(p.sell)||c.price,l=pf(p,"own",o,pr);return{p,l,r:pr>0?l/pr*100:NaN}};
async function setMeta(){const r=await mdl("Meta de lucro do mês",`<label>Quanto de lucro você quer fazer por mês (R$)</label><input type="number" inputmode="decimal" step="any" placeholder="ex.: 3000" value="${num(S.meta)||""}">`,"Salvar");if(!r)return;S.meta=Math.max(0,num(r[0]));save();render()}
Object.assign(VIEWS,{
dash:()=>{const m=U.mes,rec=monthRec(m),des=monthDes(m),luc=rec-des,mg=rec?luc/rec*100:0,ml=num(S.meta),PL=S.products.filter(ok).map(gm).filter(x=>isFinite(x.l)).sort((a,b)=>b.l-a.l),a=PL.reduce((t,x)=>t+x.l,0)/(PL.length||1),low=INS().filter(g=>num(g.min)>0&&num(g.q)<=num(g.min));
const tot=rec+des,pa=tot>0?rec/tot*100:0,neg=luc<0,
row=(x,i,w)=>`<div class="rk"><span class="n ${w?"w":""}">${i+1}</span><span class="nm">${esc(x.p.name)}</span><span class="vl">${R(x.l)}<small class="mute" style="font-weight:500;font-size:.75rem"> /un.</small></span><div class="m ${w?"w":""}"><u><i style="width:${Math.max(3,Math.min(100,Math.abs(x.r)))}%"></i></u><small>${pct(x.r)}</small></div></div>`;
return hd("Início",MESF[m]+" de "+F().ano)+mch()+(low.length?`<div class="alert"><span>Estoque baixo: ${low.slice(0,3).map(g=>esc(g.n||"sem nome")).join(", ")}${low.length>3?" e mais "+(low.length-3):""}</span><button class="lnk" onclick="go('stock')">Ver</button></div>`:"")
+`<div class="hero"><div class="lbl"><span>Lucro estimado de ${MESF[m].toLowerCase()}</span><span class="badge ${neg?"neg":""}">Margem ${pct(mg)}</span></div><b class="big ${neg?"neg":""}">${R(luc)}</b><div class="split" aria-hidden="true"><i class="a" style="width:${tot>0?pa:0}%"></i><i class="b" style="width:${tot>0?100-pa:0}%"></i></div><div class="flow"><div><span>Faturamento</span><b>${R(rec)}</b></div><div class="d"><span>Despesas e custos</span><b>${R(des)}</b></div></div></div>`
+(ml>0?`<div class="meta"><div class="price"><b>Meta de lucro</b><button class="lnk" style="padding:0" onclick="setMeta()">Alterar</button></div><div class="mbar"><i style="width:${Math.max(0,Math.min(100,luc/ml*100))}%"></i></div><p>${luc>=ml?"Meta batida!":"Faltam "+R(ml-luc)+(a>0?" · cerca de "+Math.ceil((ml-luc)/a)+" vendas":"")} · ${R(luc)} de ${R(ml)}</p></div>`:`<button class="empty" onclick="setMeta()"><p>Defina uma meta de lucro para acompanhar o mês.</p><span class="lnk" style="padding:0">Definir</span></button>`)
+(tot<=0?`<div class="empty"><p>Nenhuma venda ou despesa neste mês.</p><button class="btn" onclick="go('sales')">Registrar venda</button></div>`:"")
+`<div class="sec"><h3>Produtos mais rentáveis</h3><p class="sub">Lucro por unidade vendida e margem</p>${PL.length?PL.slice(0,3).map((x,i)=>row(x,i,0)).join(""):`<p class="mute sm" style="padding:.75rem 0">Preencha os preços dos produtos para ver o ranking.</p>`}</div>`
+(PL.length>1?`<div class="sec"><h3>Atenção: menor lucro</h3><p class="sub">Pode ser preço baixo demais.</p>${PL.slice(-2).reverse().map((x,i)=>row(x,i,x.l<=0||x.r<15)).join("")}</div>`:"")},
stock:()=>{const L=INS(),low=L.filter(g=>num(g.min)>0&&num(g.q)<=num(g.min)),H=HIS().slice(-8).reverse();
return hd("Estoque e insumos","Ingredientes, embalagens e compras")+(low.length?`<div class="err" style="margin:12px 0">Estoque baixo: ${low.map(g=>esc(g.n||"sem nome")).join(", ")}</div>`:"")+`<p class="mute sm" style="margin:12px 0">Cadastre o insumo, toque em "Registrar compra" com a quantidade e o valor pago e, no produto, escolha "Preço do estoque". A cada compra, o custo dos produtos é recalculado.</p>`+L.map((g,i)=>{const cu=num(g.yield)?num(g.pack)/num(g.yield):0,pr=usedBy(g);return`<div class="card"><button class="del" onclick="delIns(${i})" aria-label="Remover">${ic("trash",26)}</button><label style="margin-top:0">Insumo</label><input type="text" style="width:calc(100% - 2.5rem)" value="${esc(g.n)}" placeholder="ex.: Açaí" oninput="upi(${i},'n',this.value)"><div class="row"><div><label>Tipo</label><select onchange="upi(${i},'t',this.value)">${["Ingrediente","Embalagem","Outro"].map(t=>`<option ${g.t===t?"selected":""}>${t}</option>`).join("")}</select></div><div><label>Medida</label><select onchange="upi(${i},'u',this.value);render()">${Object.keys(UN).map(x=>`<option value="${x}" ${g.u===x?"selected":""}>${UN[x]}</option>`).join("")}</select></div></div><label>Fornecedor</label><input type="text" value="${esc(g.sup)}" oninput="upi(${i},'sup',this.value)"><div class="row"><div><label>Disponível (${US[g.u]||g.u})</label><input type="number" inputmode="decimal" step="any" value="${g.q||""}" oninput="upi(${i},'q',this.value,1)" onchange="render()"></div><div><label>Avisar abaixo de</label><input type="number" inputmode="decimal" step="any" value="${g.min||""}" oninput="upi(${i},'min',this.value,1)" onchange="render()"></div></div><div class="price" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><span class="mute">Custo por ${US[g.u]||g.u}</span><b class="v">${R(cu)}</b></div>${pr.length?`<p class="mute sm" style="margin-top:6px">Usado em: ${pr.map(x=>esc(x.name)).join(", ")}</p>`:""}<button class="btn sec" style="margin-top:10px" onclick="buy(${i})">Registrar compra</button></div>`}).join("")+`<button class="btn sec" onclick="addIns()">Adicionar insumo</button>`+(H.length?`<h3>Histórico de custos</h3>`+H.map(h=>{const g=INS().find(x=>x.id===h.id),pr=g?usedBy(g):[],d=h.o?(h.v-h.o)/h.o*100:0;return`<div class="card" style="padding:12px"><div class="price sm"><b>${esc(h.n||"Insumo")}</b><span class="mute">${new Date(h.at).toLocaleDateString("pt-BR")}</span></div><p class="sm" style="margin-top:4px">${R(h.o)} → <b>${R(h.v)}</b> por ${US[h.u]||h.u}${h.o?` (<span style="color:${d>0?"var(--red)":"var(--g)"}">${d>0?"+":""}${d.toFixed(1).replace(".",",")}%</span>)`:""}</p>${pr.length?`<p class="mute sm" style="margin-top:4px">Produtos afetados: ${pr.map(x=>esc(x.name)).join(", ")}</p>`:""}</div>`}).join(""):"")}
});

const PH=()=>S.phist||(S.phist=[]),SL=()=>S.sales||(S.sales=[]);
function logSell(i,v){const p=S.products[i],n=num(v);if(!p||!n)return;const l=PH().filter(x=>x.pid===p.id).pop();if(l&&l.v===n)return;PH().push({pid:p.id,n:p.name,o:l?l.v:null,v:n,at:Date.now()});save()}
function consume(p,q,sg,d){d=d||0;[...(p.items||[]).map(t=>[t,1/(num(p.rend)||1)]),...(p.deliv||[]).map(t=>[t,1])].forEach(([t,f])=>{const g=t.ref&&INS().find(x=>x.id===t.ref);if(g)g.q=num(g.q)-sg*q*f*num(t.use)/(1-Math.min(num(t.loss),90)/100)});(p.combo||[]).forEach(c=>{const x=S.products.find(y=>y.id===c.id);if(x&&x!==p&&d<3)consume(x,q*num(c.q),sg,d+1)})}
const FK={din:"Dinheiro",car:"Cartão",pix:"Pix",out:"Outro"};
function addSale(){const u=U.sl||{},p=S.products.find(x=>x.id==u.pid)||S.products[0];if(!p)return;const q=num(u.q)||1,c=calc(p,"own",hasOwn(p)),pr=num(u.pr)||num(p.sell)||c.price;if(!isFinite(pr)||pr<=0){info("Informe o preço de venda.");return}const k=u.k||"pix",d=new Date(),m=d.getMonth(),dd=d.getDate(),f=F(),day=((f.fat[m]||(f.fat[m]={}))[dd]||(f.fat[m][dd]={}));day[k]=num(day[k])+pr*q;consume(p,q,1);SL().push({id:"s"+Date.now(),pid:p.id,n:p.name,q,pr,k,m,d:dd,at:Date.now()});U.sl={pid:p.id,q:1,pr:"",k};save();render()}
async function delSale(i){const x=SL()[i],p=S.products.find(y=>y.id===x.pid);if(!await cf("Desfazer esta venda? O estoque e o faturamento voltam."))return;if(p)consume(p,x.q,-1);const day=((F().fat[x.m]||{})[x.d]);if(day)day[x.k]=Math.max(0,num(day[x.k])-x.pr*x.q);SL().splice(i,1);save();render()}
function csv(){const m=U.mes,rec=monthRec(m),des=monthDes(m),q=v=>'"'+String(v).replace(/"/g,'""')+'"',n=v=>isFinite(v)?v.toFixed(2).replace(".",","):"",L=[["Relatório Preço Certo",MESF[m]+" de "+F().ano],[],["Faturamento",n(rec)],["Despesas",n(des)],["Lucro",n(rec-des)],[],["Produto","Custo","Preço iFood (entregador do app)","Preço delivery próprio","Lucro por venda (próprio)","Margem %"]];S.products.filter(ok).forEach(p=>{const g=gm(p);L.push([p.name,n(cost(p)),n(priceFor(p,"ifood",false)),n(priceFor(p,"own")),n(g.l),n(g.r)])});L.push([],["Despesa","Valor"]);expList(m).forEach(e=>L.push([e.n,n(num(e.v))]));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="relatorio-preco-certo-"+MES[m]+".csv";a.click()}
const dl=(o,v)=>o?((v-o)/o*100):0,dp=(o,v)=>o?` (<span style="color:${v>o?"var(--red)":"var(--g)"}">${v>o?"+":""}${dl(o,v).toFixed(1).replace(".",",")}%</span>)`:"";
Object.assign(VIEWS,{
sales:()=>{const u=U.sl||(U.sl={pid:(S.products[0]||{}).id,q:1,pr:"",k:"pix"}),p=S.products.find(x=>x.id==u.pid)||S.products[0],L=SL().map((x,i)=>[x,i]).slice(-10).reverse();if(!p)return hd("Vendas","Registre o que vendeu")+'<p class="mute" style="margin-top:14px">Cadastre um produto primeiro.</p>';const c=calc(p,"own",hasOwn(p)),dfl=num(p.sell)||c.price;
return hd("Vendas","Cada venda dá baixa no estoque e entra no faturamento")+`<div class="card" style="margin-top:14px"><label style="margin-top:0">Produto</label><select onchange="U.sl.pid=this.value;U.sl.pr='';render()">${S.products.map(x=>`<option value="${x.id}" ${x.id==p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><div class="row"><div><label>Quantidade</label><input type="number" inputmode="decimal" value="${u.q}" oninput="U.sl.q=this.value"></div><div><label>Preço unitário (R$)</label><input type="number" inputmode="decimal" step="any" value="${u.pr||(isFinite(dfl)?dfl.toFixed(2):"")}" oninput="U.sl.pr=this.value"></div></div><label>Pagamento</label><div class="chips" style="margin:0">${Object.keys(FK).map(k=>`<button class="chip ${u.k===k?"on":""}" onclick="U.sl.k='${k}';render()">${FK[k]}</button>`).join("")}</div><button class="btn" style="margin-top:14px" onclick="addSale()">Registrar venda</button></div>${L.length?"<h3>Últimas vendas</h3>"+L.map(([x,i])=>`<div class="card" style="padding:12px"><div class="price sm"><b>${x.q}x ${esc(x.n)}</b><b>${R(x.pr*x.q)}</b></div><div class="price sm" style="margin-top:4px"><span class="mute">${new Date(x.at).toLocaleDateString("pt-BR")} · ${FK[x.k]}</span><button class="lnk" style="color:var(--red)" onclick="delSale(${i})">Desfazer</button></div></div>`).join(""):""}`},

return hd("Relatórios",MESF[m]+" de "+F().ano)+`<div class="noprint">${mch()}<div class="row" style="margin:12px 0"><button class="btn sec" onclick="window.print()">Imprimir / salvar PDF</button><button class="btn sec" onclick="csv()">Baixar Excel</button></div></div><div class="g2" style="margin:12px 0">${k("Faturamento",R(rec))}${k("Despesas",R(des))}${k("Lucro",R(rec-des))}${k("Margem",pct(rec?(rec-des)/rec*100:0))}</div><h3>Produtos e preços recomendados</h3>`+(PL.map(([p,i])=>{const g=gm(p);return`<div class="card"><div class="price"><b>${esc(p.name)}</b><button class="lnk noprint" style="font-weight:700" onclick="go('ficha',${i})">Ficha</button></div>${[["Custo",R(cost(p))],["iFood (entregador do app)",PR(priceFor(p,"ifood",false))],["Delivery próprio",PR(priceFor(p,"own"))],["Lucro por venda",R(g.l)+" · "+pct(g.r)]].map(r=>`<div class="price sm" style="margin-top:4px"><span class="mute">${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>`}).join("")||'<p class="mute">Preencha os preços dos produtos.</p>')+`<h3>Despesas do mês</h3><div class="card">${expList(m).filter(e=>num(e.v)).map(e=>`<div class="price sm"><span>${esc(e.n)}</span><b>${R(num(e.v))}</b></div>`).join("")||'<p class="mute sm">Sem despesas lançadas.</p>'}</div>`},

<script id="preco-certo-theme-script">
(function(){
 try{
  var saved=localStorage.getItem("pc_theme");
  if(saved==="dark"||saved==="light")document.documentElement.dataset.theme=saved;
 }catch(e){}
 function addButton(){
  var old=document.getElementById("pc-theme-toggle");if(old)old.remove();return;
  if(document.getElementById("pc-theme-toggle"))return;
  var b=document.createElement("button");
  b.id="pc-theme-toggle";
  b.type="button";
  b.setAttribute("aria-label","Alternar modo escuro");
  b.title="Alternar modo claro/escuro";
  function draw(){
   var dark=document.documentElement.dataset.theme==="dark";
   b.textContent=dark?"☀️":"🌙";
   b.setAttribute("aria-pressed",String(dark));
  }
  b.addEventListener("click",function(){
   var next=document.documentElement.dataset.theme==="dark"?"light":"dark";
   document.documentElement.dataset.theme=next;
   try{localStorage.setItem("pc_theme",next)}catch(e){}
   draw();
  });
  document.body.appendChild(b);draw();
 }
 if(document.readyState==="loading")
  document.addEventListener("DOMContentLoaded",addButton);
 else addButton();
})();
</script>
